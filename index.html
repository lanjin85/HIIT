<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111923"><title>LAN JIN SMART CORE HIIT 2.0</title><style>*{box-sizing:border-box}body{background:#111923;color:#f5f7fa;font:16px system-ui;margin:0}main{max-width:460px;margin:auto;padding:20px}header,small{color:#a0aebe}b.accent,h2 span{color:#b5ef55}header{display:flex;justify-content:space-between}h2{margin:10px 0}h2 span{font-size:12px}.row{display:flex;gap:8px;align-items:center}.panel,label.setting{background:#202c39;border-radius:12px;padding:12px}.setting{flex:1;min-width:0;font-size:12px}.setting input{width:100%;background:none;color:white;border:0;font-size:25px}.center{text-align:center}#status{margin-top:18px;font-weight:800}#dial{position:relative;width:43%;flex-shrink:0}#dial div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}#clock{font-size:clamp(40px,12vw,65px);line-height:1}svg{width:100%;display:block}#demo{flex:1;min-width:0}button{border:0;border-radius:12px;padding:15px;background:#293747;color:white;font-weight:bold;cursor:pointer}#start{flex:3;background:#b5ef55;color:#111923;font-size:18px}#reset{flex:1}#list{display:grid;grid-template-columns:1fr 1fr;gap:8px}#list article{border:1px solid #334252;border-radius:12px;padding:8px;background:#202c39;font-size:12px}#progress{display:flex;gap:5px;margin:14px 0}#progress i{flex:1;height:5px;border-radius:4px}p{font-size:13px;color:#c2cfdd}#name{margin:6px}#english{color:#b5ef55;font-size:13px}</style><main><header><b class="accent">LAN JIN</b><small>VERSION 2.0</small></header><h2>SMART HIIT <span>MOTION</span></h2><div class="row"><label class="setting">운동 (초)<input id="w" type="number" min="5" max="300" value="20"></label><label class="setting">휴식 (초)<input id="r" type="number" min="3" max="300" value="10"></label><label class="setting">세트<input id="s" type="number" min="1" max="20" value="1"></label></div><div id="status" class="center"></div><div class="row" style="margin:14px 0"><div id="dial"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="none" stroke="#293747" stroke-width="8"/><circle id="ring" cx="90" cy="90" r="80" fill="none" stroke="#b5ef55" stroke-width="8" stroke-dasharray="502.65" stroke-linecap="round" transform="rotate(-90 90 90)"/></svg><div><b id="clock">20</b><small id="setnum"></small></div></div><div class="panel" id="demo"><small id="demoLabel">MOTION DEMO</small><svg id="motion" viewBox="0 0 260 160"></svg><small id="muscle"></small></div></div><div class="center"><small id="number"></small><h3 id="name"></h3><div id="english"></div><p id="cue"></p></div><div id="progress"></div><div class="row"><button id="start">▶ 시작</button><button id="reset">↻ 초기화</button></div><p class="center"><label><input id="sound" type="checkbox" checked> 알람음</label>　<label><input id="voice" type="checkbox" checked> 음성 안내</label></p><div class="panel"><small>전체 예상 시간</small> <b id="total" style="float:right"></b><p id="next"></p></div><h4>WORKOUT · 6가지 동작</h4><div id="list"></div><div class="panel" style="margin-top:14px"><b class="accent">SMART COACH</b><p id="coach"></p><small>휴식 마지막 3초에 다음 동작을 미리 보여줍니다.</small></div></main><script>
const $=id=>document.getElementById(id), moves=[['마운틴 클라이머','Mountain Climbers','무릎을 가슴 방향으로 번갈아 당기세요.','복직근 · 장요근','허리가 처지지 않게 유지하세요.'],['플랭크 잭','Plank Jacks','양발을 동시에 벌렸다 모으세요.','복횡근 · 복직근 · 중둔근','착지를 부드럽게 하세요.'],['베어 플랭크 니 탭','Bear Plank Knee Taps','무릎을 띄우고 반대 손으로 터치하세요.','복횡근 · 복사근','골반을 흔들지 마세요.'],['플랭크 힙 트위스트','Plank Hip Twists','팔꿈치를 지지하고 골반을 좌우로 회전하세요.','외복사근 · 내복사근','허리를 과도하게 비틀지 마세요.'],['스파이더맨 플랭크','Spiderman Planks','무릎을 같은 쪽 팔꿈치로 당기세요.','복사근 · 장요근','어깨와 골반을 안정적으로 유지하세요.'],['크로스바디 마운틴 클라이머','Cross-body Mountain Climbers','무릎을 반대쪽 팔꿈치로 당기세요.','복직근 · 복사근 · 장요근','골반의 과도한 회전을 피하세요.']];
function pose(i,t){let a=(1+Math.sin(t))/2,b=1-a,h=[135,68],s=[73,61],head=[54,46],k=[181,103],f=[229,135],k2=[184,108],f2=[235,140],e=[74,100],p=[72,138],e2=[84,101],p2=[89,140];if(i===0){k=[181-83*a,103+12*a];f=[229-72*a,135-20*a];k2=[184-83*b,108+12*b];f2=[235-72*b,140-20*b]}if(i===1){k=[180-12*a,103+10*a];f=[229-17*a,135+13*a];k2=[184+9*a,108-12*a];f2=[235+13*a,140-17*a]}if(i===2){h=[137,59];k=[137,119];f=[187,139];k2=[151,116];f2=[200,135];let q=Math.max(0,Math.sin(t)),v=Math.max(0,-Math.sin(t));e=[74+23*q,100-10*q];p=[72+78*q,138-22*q];e2=[84+20*v,101-10*v];p2=[89+48*v,140-21*v]}if(i===3){s=[75,83];head=[54,66];h=[135,83+10*Math.sin(t)];e=[76,137];p=[40,137];e2=[89,133];p2=[53,133]}if(i===4){k=[181-98*a,103+24*a];f=[229-80*a,135+12*a];k2=[184-98*b,108-15*b];f2=[235-80*b,140-30*b]}if(i===5){k=[181-98*a,103-8*a];f=[229-80*a,135-22*a];k2=[184-98*b,108+9*b];f2=[235-80*b,140-22*b]}const l=(x,y,c,w)=>`<path d="M${x.join(' ')} L${y.join(' ')}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;return '<path d="M15 148H249" stroke="#506174"/>'+l(h,k2,'#55736b',15)+l(k2,f2,'#b98b73',10)+l(s,e2,'#b98b73',10)+l(e2,p2,'#b98b73',8)+l(s,h,'#b5ef55',27)+l([103,65],h,'#f59b65',10)+l(h,k,'#759e86',16)+l(k,f,'#e3b49a',11)+l(f,[f[0]+7,f[1]+3],'#f0f4fa',10)+l(s,e,'#e3b49a',11)+l(e,p,'#e3b49a',9)+l(s,head,'#e3b49a',10)+`<circle cx="${head[0]}" cy="${head[1]}" r="13" fill="#e3b49a"/>`}
let W=20,R=10,S=1,idx=0,set=1,phase='ready',left=20,dur=20,running=false,deadline=0,remaining=20000,timer,audio,last=-1,preview=false;function settings(){for(const [id,min,max,def] of [['w',5,300,20],['r',3,300,10],['s',1,20,1]])$(id).value=Math.max(min,Math.min(max,Math.floor(Number($(id).value)||def)));W=+$('w').value;R=+$('r').value;S=+$('s').value}function beep(f=850){if(!$('sound').checked||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch{}}function say(t){if($('voice').checked&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function di(){return phase==='rest'?(idx+1)%6:idx}function draw(){let m=moves[di()],p=phase==='rest'&&left<=3,c=p||phase==='prep'?'#ffca66':phase==='rest'?'#64b9ff':'#b5ef55';$('status').textContent=p?'NEXT UP · 다음 동작 미리보기':({ready:'READY · 준비',prep:'GET READY · 미리보기',work:'WORK · 운동',rest:'REST · 휴식',done:'COMPLETE · 완료'})[phase];$('status').style.color=c;$('ring').setAttribute('stroke',c);$('ring').setAttribute('stroke-dashoffset',502.65*(1-left/dur));$('clock').textContent=String(left).padStart(2,'0');$('setnum').textContent=`SET ${set} / ${S}`;$('number').textContent=`${phase==='rest'?'NEXT':'EXERCISE'} 0${di()+1} / 06`;$('name').textContent=m[0];$('english').textContent=m[1];$('cue').textContent=phase==='rest'&&!p?'호흡을 정리하세요.':m[2];$('muscle').textContent=m[3];$('coach').textContent=m[4];$('demoLabel').textContent=p||phase==='prep'?'▶ 3초 동작 미리보기':'● MOTION DEMO';$('start').textContent=running?'Ⅱ 일시정지':phase==='ready'?'▶ 시작':phase==='done'?'▶ 다시 시작':'▶ 계속';let n=6*S*W+(6*S-1)*R;$('total').textContent=`${Math.floor(n/60)}분 ${n%60}초`;$('next').textContent=idx===5&&set===S?'다음: 운동 종료':'다음: '+moves[(idx+1)%6][0];$('progress').innerHTML=moves.map((_,i)=>`<i style="background:${i<=idx?c:'#293747'}"></i>`).join('');moves.forEach((_,i)=>$('card'+i).style.borderColor=i===di()?c:'#334252')}
function lock(v){['w','r','s'].forEach(k=>$(k).disabled=v)}function begin(p,d){phase=p;dur=left=d;remaining=d*1000;deadline=Date.now()+remaining;last=d;preview=false;beep(p==='rest'?450:950);say(p==='rest'?'휴식':moves[idx][0]+(p==='prep'?' 준비':' 시작'));draw()}function advance(){if(phase==='prep')begin('work',W);else if(phase==='work'){if(idx===5&&set===S){phase='done';running=false;left=0;clearInterval(timer);lock(false);beep(1200);say('모든 운동을 완료했습니다');draw()}else begin('rest',R)}else if(phase==='rest'){if(++idx===6){idx=0;set++}begin('work',W)}}function tick(){if(!running)return;remaining=Math.max(0,deadline-Date.now());left=Math.ceil(remaining/1000);if(left!==last){last=left;if(left>0&&left<=3)beep(650);if(phase==='rest'&&left<=3&&left>0&&!preview){preview=true;say('다음 운동 '+moves[(idx+1)%6][0])}draw()}if(!remaining)advance()}function reset(){running=false;clearInterval(timer);if(window.speechSynthesis)speechSynthesis.cancel();settings();phase='ready';idx=0;set=1;dur=left=W;remaining=W*1000;lock(false);draw()}$('list').innerHTML=moves.map((m,i)=>`<article id="card${i}"><small>0${i+1}</small><svg viewBox="0 0 260 160">${pose(i,1.2)}</svg><b>${m[0]}</b><p>${m[3]}</p></article>`).join('');$('start').onclick=()=>{try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}if(running){remaining=Math.max(0,deadline-Date.now());left=Math.ceil(remaining/1000);running=false;clearInterval(timer);if(window.speechSynthesis)speechSynthesis.cancel();draw();return}if(phase==='done')reset();running=true;lock(true);if(phase==='ready'){settings();begin('prep',3)}else deadline=Date.now()+remaining;timer=setInterval(tick,80);draw()};$('reset').onclick=reset;['w','r','s'].forEach(k=>$(k).onchange=reset);reset();function animate(t){$('motion').innerHTML=pose(di(),running||phase==='ready'?t/240:1.2);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></html>
